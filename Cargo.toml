[workspace]
resolver = "3"
members = [
    "crates/vault-formats",
    "crates/vault-vm",
    "crates/vault-core",
    "crates/vault-guidance",
    "crates/vault-render",
    "crates/vault-debug",
    "crates/vault-platform",
    "tools/xtask",
    "tools/asset-audit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
vault-core = { path = "crates/vault-core" }
vault-formats = { path = "crates/vault-formats" }
vault-guidance = { path = "crates/vault-guidance" }
vault-render = { path = "crates/vault-render" }
vault-vm = { path = "crates/vault-vm" }
bytemuck = "1.24"
cap-std = "4.0.3"
clap = { version = "4.5", features = ["derive"] }
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slotmap = { version = "1.1.1", features = ["serde"] }
tempfile = "3.23"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
wgpu = "27.0.1"
winit = "0.30.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
