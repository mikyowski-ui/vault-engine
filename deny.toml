# cargo-deny policy (`cargo deny check`), run in CI with `cargo audit`.

[graph]
all-features = true

[advisories]
# RustSec vulnerabilities always fail; unmaintained crates fail when they are
# direct workspace dependencies.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
# Permissive licenses only; the workspace crates are unpublished.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The fuzz workspace's libfuzzer-sys bundles LLVM's libFuzzer under the
# permissive NCSA license; it is allowed for that crate only.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
