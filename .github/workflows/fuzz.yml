name: Fuzz smoke

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

# Third-party actions are pinned by version tag, not by commit SHA: the
# repository's clean-room ingestion tooling rejects 40-character hashes.

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # `fuzz/` is outside the workspace, so the root fmt gate skips it.
      - run: rustfmt --edition 2024 --check fuzz/fuzz_targets/*.rs
      # Synthetic seeds only; no game data enters the corpora.
      - run: python3 -I fuzz/seed.py
      # Fails if fuzz/Cargo.lock is out of date, so the fuzz build below
      # resolves exactly the locked versions (the `--locked` guarantee).
      - run: cargo fetch --manifest-path fuzz/Cargo.toml --locked
      - name: cargo fuzz build
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo +nightly fuzz build 2>&1 | tee fuzz-output.txt
      - name: cargo fuzz run
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          for target in $(cargo +nightly fuzz list); do
            echo "==== fuzz target $target" | tee -a fuzz-output.txt
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048 \
              2>&1 | tee -a fuzz-output.txt || exit 1
          done
      # Build errors and the crashing target become error annotations:
      # annotations are readable where the job log needs admin rights.
      - name: Report fuzz failures
        if: failure()
        run: |
          test -f fuzz-output.txt || exit 0
          awk '/^==== fuzz target / { target = $4 }
               /^error(\[E[0-9]+\])?: |^==[0-9]+==ERROR|^thread .* panicked|^SUMMARY: / {
                 if (open) print msg
                 msg = (target != "" ? "[" target "] " : "") $0; n = 0; open = 1; next }
               open && n < 8 { msg = msg "%0A" $0; n++; if (n == 8) { print msg; open = 0 } }
               END { if (open) print msg }' fuzz-output.txt \
            | head -n 40 | sed 's/^/::error title=fuzz smoke::/'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
