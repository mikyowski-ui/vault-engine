name: Engineering gates

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The desktop's default `audio` feature links ALSA through cpal.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cpal uses WASAPI on Windows; no extra system packages are needed.
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: vault-engine-windows-x86_64
          path: |
            target/release/vault-platform.exe
            target/release/asset-audit.exe
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # RustSec advisories against Cargo.lock.
      - run: cargo audit
      # Advisories, licenses, bans, and sources from deny.toml.
      - run: cargo deny --locked check

