[package]
name = "vault-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vault-core = { path = "../crates/vault-core" }
vault-formats = { path = "../crates/vault-formats" }
vault-vm = { path = "../crates/vault-vm" }

# Kept out of the main workspace: cargo-fuzz builds with nightly sanitizer flags.
[workspace]

[[bin]]
name = "dat"
path = "fuzz_targets/dat.rs"
test = false
doc = false
bench = false

