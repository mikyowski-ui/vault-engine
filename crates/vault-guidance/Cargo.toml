[package]
name = "vault-guidance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["host-fs"]
# The file-backed providers (SPEC-023 section 3.6).
host-fs = ["vault-formats/host-fs"]

[dependencies]
# By path: edition 2024 refuses `default-features = false` over `workspace = true`.
vault-formats = { path = "../vault-formats", default-features = false }

[lints]
workspace = true
