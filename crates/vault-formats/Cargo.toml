[package]
name = "vault-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["host-fs"]
# The file-backed providers and archive constructors (SPEC-023 section 3.6).
# Without it the crate reaches no OS path, and builds for wasm32.
host-fs = ["dep:cap-std"]

[dependencies]
cap-std = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
vault-fixtures.workspace = true

[lints]
workspace = true
